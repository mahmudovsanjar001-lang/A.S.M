<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.S.M — barcha havolalar</title>
<style>
  :root{
    --bg-0:#0e0c0a;
    --bg-1:#15120f;
    --beam:#f2e8d8;
    --beam-dim:#c9bda4;
    --amber:#b8703e;
    --amber-bright:#e0975c;
    --ink:#efe8db;
    --ink-dim:#a89e8d;
    --line: rgba(239,232,219,0.12);
    --shadow-blue:#23272f;
    --font-display: 'Fraunces', 'Iowan Old Style', Georgia, serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  @font-face{
    font-family:'Fraunces';
    src: local('Fraunces');
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    background: var(--bg-0);
    color: var(--ink);
    font-family: var(--font-body);
    min-height:100vh;
    overflow-x:hidden;
  }

  body{
    position:relative;
    display:flex;
    justify-content:center;
    padding: 64px 20px 40px;
  }

  .bg-video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;
    filter: brightness(0.42) saturate(1.05);
  }

  .bg-overlay{
    position:fixed;
    inset:0;
    z-index:-1;
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(14,12,10,0.35), rgba(14,12,10,0.85) 70%),
      linear-gradient(180deg, rgba(14,12,10,0.55) 0%, rgba(14,12,10,0.75) 100%);
  }

  /* diagonal light beam across the whole page, echoing the portrait's window light */
  body::before{
    content:"";
    position:fixed;
    inset:-10% -20%;
    background:
      linear-gradient(115deg,
        transparent 0%,
        transparent 38%,
        rgba(242,232,216,0.05) 42%,
        rgba(242,232,216,0.09) 46%,
        transparent 52%,
        transparent 100%);
    pointer-events:none;
    z-index:0;
    animation: beam-drift 14s ease-in-out infinite;
  }

  @keyframes beam-drift{
    0%, 100%{ transform: translateX(0) translateY(0); }
    50%{ transform: translateX(2.5%) translateY(-1.5%); }
  }

  @keyframes rise-in{
    from{ opacity:0; transform: translateY(14px); filter: blur(2px); }
    to{ opacity:1; transform: translateY(0); filter: blur(0); }
  }

  @keyframes glow-pulse{
    0%, 100%{ opacity:0.6; transform: scale(1); }
    50%{ opacity:1; transform: scale(1.08); }
  }

  body::after{
    content:"";
    position:fixed;
    inset:0;
    background: radial-gradient(ellipse 60% 40% at 50% 0%, rgba(184,112,62,0.10), transparent 70%);
    pointer-events:none;
    z-index:0;
  }

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .frame{
    position:relative;
    width:168px;
    height:168px;
    margin-bottom:28px;
    animation: rise-in 0.8s cubic-bezier(0.22,1,0.36,1) both;
    animation-delay: 0.05s;
  }

  .frame::before{
    content:"";
    position:absolute;
    inset:-6px;
    border:1px solid var(--line);
    border-radius:4px;
    transform:rotate(45deg) scale(0.78);
    z-index:0;
  }

  .avatar{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
    display:block;
    position:relative;
    z-index:1;
    filter: grayscale(0.15) contrast(1.05);
    box-shadow:
      0 0 0 1px rgba(239,232,219,0.15),
      0 20px 40px -12px rgba(0,0,0,0.7);
  }

  .frame .glow{
    position:absolute;
    inset:-14px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(224,151,92,0.25), transparent 70%);
    z-index:0;
    filter: blur(6px);
    animation: glow-pulse 4.5s ease-in-out infinite;
  }

  .eyebrow{
    font-family:var(--font-body);
    font-size:11px;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color:var(--amber-bright);
    margin-bottom:10px;
    font-weight:600;
    animation: rise-in 0.8s cubic-bezier(0.22,1,0.36,1) both;
    animation-delay: 0.2s;
  }

  h1{
    font-family: var(--font-display);
    font-weight:600;
    font-size:42px;
    letter-spacing:0.01em;
    color:var(--beam);
    line-height:1;
    margin-bottom:10px;
    text-align:center;
    animation: rise-in 0.8s cubic-bezier(0.22,1,0.36,1) both;
    animation-delay: 0.3s;
  }

  .tagline{
    font-size:14px;
    color:var(--ink-dim);
    text-align:center;
    max-width:280px;
    line-height:1.5;
    margin-bottom:36px;
    font-weight:400;
    animation: rise-in 0.8s cubic-bezier(0.22,1,0.36,1) both;
    animation-delay: 0.4s;
  }

  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .link{
    position:relative;
    display:flex;
    align-items:center;
    gap:16px;
    width:100%;
    padding:18px 20px;
    background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015));
    border:1px solid var(--line);
    border-radius:2px;
    text-decoration:none;
    color:var(--ink);
    overflow:hidden;
    transition: border-color 0.25s ease, transform 0.2s ease, background 0.25s ease;
    animation: rise-in 0.8s cubic-bezier(0.22,1,0.36,1) both;
  }

  .links .link:nth-child(1){ animation-delay: 0.5s; }
  .links .link:nth-child(2){ animation-delay: 0.6s; }
  .links .link:nth-child(3){ animation-delay: 0.7s; }

  .link::before{
    content:"";
    position:absolute;
    top:0; left:0; bottom:0;
    width:2px;
    background: var(--accent, var(--amber));
    transform: scaleY(0);
    transform-origin:bottom;
    transition: transform 0.3s ease;
  }

  .link:hover{
    border-color: color-mix(in srgb, var(--accent, var(--amber-bright)) 55%, transparent);
    background: linear-gradient(180deg, color-mix(in srgb, var(--accent, var(--amber)) 12%, transparent), rgba(255,255,255,0.015));
    transform: translateX(3px);
  }

  .link:hover::before{
    transform: scaleY(1);
  }

  .link .icon{
    width:20px;
    height:20px;
    flex-shrink:0;
    color:var(--beam-dim);
    transition: color 0.25s ease;
  }

  .link:hover .icon{ color: var(--accent, var(--amber-bright)); }

  .link-text{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  .link-title{
    font-size:15px;
    font-weight:600;
    letter-spacing:0.01em;
  }

  .link-sub{
    font-size:11px;
    color:var(--ink-dim);
    letter-spacing:0.04em;
    text-transform:uppercase;
  }

  .arrow{
    color: var(--ink-dim);
    font-size:14px;
    transition: transform 0.25s ease, color 0.25s ease;
  }

  .link:hover .arrow{
    color:var(--accent, var(--amber-bright));
    transform: translateX(3px);
  }

  footer{
    margin-top:48px;
    text-align:center;
  }

  footer .rule{
    width:32px;
    height:1px;
    background:var(--line);
    margin:0 auto 16px;
  }

  footer p{
    font-size:11px;
    color:var(--ink-dim);
    letter-spacing:0.08em;
  }

  @media (prefers-reduced-motion: reduce){
    .link, .link::before, .link .icon, .arrow{ transition:none; }
  }

  @media (max-width:420px){
    h1{ font-size:36px; }
    .frame{ width:140px; height:140px; }
  }
</style>
</head>
